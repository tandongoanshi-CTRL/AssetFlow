<div class="workspace-container">
  <!-- Sidebar Navigation Drawer Pane matching Rest of App Pages -->
  <aside class="sidebar">
    <div class="sidebar-header-box">
      <div class="app-icon-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="2" y1="20" x2="22" y2="20"></line></svg>
      </div>
      <div class="sidebar-header-text">
        <h2>AssetFlow</h2>
        <p>ENTERPRISE RESOURCE</p>
      </div>
    </div>
    
    <ul class="sidebar-menu">
      <li *ngFor="let item of SIDEBAR_NAV_CONFIG">
        <a [routerLink]="[item.routePath]" class="sidebar-item" [class.active]="item.id === 'alloc'">
          <span class="nav-icon-span" [ngClass]="item.iconClass"></span>
          <span>{{ item.label }}</span>
        </a>
      </li>
    </ul>
    
    <ul class="sidebar-menu bottom-menu">
      <li>
        <a href="#" class="sidebar-item" (click)="$event.preventDefault()">
          <span class="nav-icon-span icon-support"></span>
          <span>Support</span>
        </a>
      </li>
      <li>
        <a href="#" class="sidebar-item critical-action" (click)="$event.preventDefault()">
          <span class="nav-icon-span icon-logout"></span>
          <span>Log Out</span>
        </a>
      </li>
    </ul>
  </aside>

  <!-- Offset Main Frame Content Area to the right of Sidebar -->
  <main class="content-frame">
    <div class="form-surface-card">
      
      <div class="form-group full-width">
        <label class="control-label">Asset</label>
        <div class="input-display-lock">
          <span>{{ assetName }}</span>
          <svg class="lock-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
      </div>

      <h2 class="form-block-heading">Transfer Request</h2>

      <div class="inputs-split-row">
        <div class="form-group flex-half">
          <label class="control-label">From</label>
          <div class="input-display-readonly">
            {{ currentOwner }}
          </div>
        </div>

        <div class="form-group flex-half">
          <label class="control-label">To</label>
          <div class="select-field-container">
            <select class="custom-select-control" [(ngModel)]="targetEmployee">
              <option value="" disabled selected hidden>Select Employee....</option>
              <option *ngFor="let emp of employeesList" [value]="emp">{{ emp }}</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-group full-width space-adjust">
        <label class="control-label">Reason</label>
        <textarea class="custom-textarea-control" placeholder="Add context for this transfer..." [(ngModel)]="transferReason"></textarea>
      </div>

      <div class="action-btn-row">
        <button class="btn-submit-request" (click)="onSubmitTransfer()">
          <span>Submit Request</span>
          <svg class="submit-arrow-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

      <div class="divider-rule"></div>

      <div class="timeline-block-surface">
        <h3 class="timeline-title-header">Allocation history</h3>
        
        <div class="timeline-trace-canvas">
          <div class="timeline-node-item" *ngFor="let event of allocationHistory; let indexLast = last" [class.last-node]="indexLast">
            <div class="node-indicator-left">
              <div class="circle-bullet" [ngClass]="{'bullet-active': event.type === 'allocated', 'bullet-passive': event.type === 'returned'}">
                <div class="inner-dot"></div>
              </div>
              <div class="vertical-connector-line" *ngIf="!indexLast"></div>
            </div>
            <div class="node-content-right">
              <div class="event-timestamp">{{ event.date }}</div>
              <p class="event-description-text">
                {{ event.mainText }}<strong>{{ event.boldText }}</strong>{{ event.extraText }}<span *ngIf="event.highlightText" class="teal-highlight">{{ event.highlightText }}</span>
              </p>
            </div>
          </div>
        </div>

      </div>

    </div>
  </main>
</div>
