<div class="login-wrapper">
  <!-- Main Centered Container Card -->
  <div class="login-card">
    
    <!-- Branding Section -->
    <div class="brand-header">
      <!-- Logo Image Container -->
<div class="logo-box">
  <img src="assetflow_logo.png" alt="AssetFlow Logo">
</div>
<h1 class="brand-title">AssetFlow</h1>
<p class="brand-subtitle">Enterprise Asset & Resource Management</p>
    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      
      <!-- Email Input Field Group -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email"
          [(ngModel)]="loginData.email"
          placeholder="name@company.com" 
          required>
      </div>

      <!-- Password Input Field Group -->
      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a href="#" class="forgot-link" (click)="onForgotPassword($event)">Forgot Password?</a>
        </div>
        <div class="password-input-container">
          <input 
            [type]="showPassword ? 'text' : 'password'" 
            id="password" 
            name="password"
            [(ngModel)]="loginData.password"
            placeholder="••••••••" 
            required>
          <!-- Interactive Eye Visibility Icon -->
          <button type="button" class="visibility-toggle" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>

      <!-- Remember Me Checkbox -->
      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" name="rememberMe" [(ngModel)]="loginData.rememberMe">
          <span class="checkmark"></span>
          Remember me
        </label>
      </div>

      <!-- Submit Action Button -->
      <button type="submit" class="btn-submit">Log in</button>
    </form>

    <!-- Bottom Account Creation Link Divider -->
    <div class="divider"></div>
    <div class="signup-footer">
      <span class="footer-text">
    Don't have an account? <a routerLink="/signup" class="teal-link bold-link">Sign up</a>
</span>
    </div>

  </div>

  <!-- Explicit Bottom System Notice Logic -->
  <p class="system-notice">
    Note: Account creation defaults strictly to standard Employee permissions. Administrative roles must be assigned via the Organization Setup Directory.[cite: 1]
  </p>
</div>
